name: GodHand Android ARM64 Build

on:
  push:
    branches:
      - main
      - master
      - "fix/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godhand-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build and package ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.22.1
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Gitlinks exist without .gitmodules; restore them from pinned upstream commits below.

      - name: Restore pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          restore_gitlink() {
            local repo_url="$1"
            local target="$2"
            local commit="$3"
            local temp
            temp="$(mktemp -d)"
            git clone --filter=blob:none "$repo_url" "$temp/repo"
            git -C "$temp/repo" checkout --detach "$commit"
            rm -rf "$target"
            mkdir -p "$(dirname "$target")"
            mv "$temp/repo" "$target"
            rm -rf "$temp"
          }
          restore_gitlink "https://github.com/google/oboe.git" "app/src/main/cpp/thirdparty/oboe" "4468344c8fdfdd7df068d5abefe2d8615fd6b431"
          restore_gitlink "https://github.com/simd-everywhere/simde.git" "app/src/main/cpp/thirdparty/simde" "2e5224981e9123b8fe89a9833a978556d636a565"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to installing the obsolete "tools" package,
          # which sdkmanager no longer provides. Install only platform-tools here.
          packages: platform-tools

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Validate wrapper and project files
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/jni_bridge.cpp
          test -f app/src/main/cpp/thirdparty/oboe/CMakeLists.txt
          test -d app/src/main/cpp/thirdparty/simde/simde
          chmod +x gradlew
          ./gradlew --version

      - name: Cache Gradle and native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: ${{ runner.os }}-godhand-arm64-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-godhand-arm64-

      - name: Build release APK (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --parallel --max-workers=2 --stacktrace :app:assembleRelease

      - name: Verify APK and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK size: $(stat -c '%s bytes' "$APK")"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libgodhand_android\.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libpcsx2gs\.so' || true
          mkdir -p build-report
          cp "$APK" build-report/GodHandAndroid-arm64-release.apk
          sha256sum "$APK" | tee build-report/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GodHandAndroid-ARM64-APK
          path: |
            build-report/GodHandAndroid-arm64-release.apk
            build-report/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
